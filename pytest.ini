[pytest]
addopts = -v --tb=short -m "not benchmark"
testpaths = sgwt/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    dll: marks tests requiring DLL (CHOLMOD/KLU) availability
    slow: marks tests as slow (stress tests, large graphs)
    benchmark: marks tests as performance benchmarks (deselected by default)
filterwarnings =
    ignore::DeprecationWarning