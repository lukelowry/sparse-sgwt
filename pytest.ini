[pytest]
addopts = -v --tb=short
testpaths = sgwt/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    dll: marks tests requiring DLL (CHOLMOD/KLU) availability
    slow: marks tests as slow (stress tests, large graphs) - run with --run-slow
filterwarnings =
    ignore::DeprecationWarning